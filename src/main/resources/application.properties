spring.application.name=Spa-manager
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spa_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:7200000}

brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:spa.manager.app@gmail.com}
brevo.from.name=${BREVO_FROM_NAME:Spa Manager}

cors.allowed.origin.ip=${CORS_ALLOWED_ORIGIN_IP:http://localhost:4200}